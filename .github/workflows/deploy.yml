name: Deploy to GitHub Pages

on:
  # Run on every push to the default branch
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Allow this job to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history: the front page lists recently updated articles from git
          fetch-depth: 0
      - name: Build Astro site
        uses: withastro/action@v3
        with:
          # Astro 6 requires Node >=22.12; the action defaults to Node 20.
          node-version: 22
        # Other defaults work for this repo: package manager auto-detected (npm),
        # build = `astro build`, artifact path = ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
