<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Rexor</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#2a231c;color:#efe3c8;font:17px/1.5 Georgia,serif}
  main{max-width:34rem;padding:2rem}
  h1{font-size:1.6rem;letter-spacing:.08em;margin:0 0 .4rem;color:#d8b46a}
  a{color:#f0c66a} li{margin:.5rem 0} small{color:#b9a98a}
  input,button{font:inherit;padding:.5rem .7rem;border-radius:4px;border:1px solid #6b5a3c;background:#1b1611;color:#efe3c8}
  button{background:#a8741a;border-color:#a8741a;color:#fff;cursor:pointer}
  form{display:flex;gap:.5rem;margin-top:1rem} input{flex:1} #msg{color:#e7a08a;min-height:1.5em}
</style></head><body><main>
<h1>Rexor</h1>
<p>This page is for the DM. It opens with the same passphrase as the DM content in the Encounter Builder.</p>
<form id="f"><input id="p" type="password" autocomplete="current-password" placeholder="DM passphrase" autofocus><button>Open</button></form>
<p id="msg"></p>
<script type="module">
import { decryptPack } from './pack-crypto.js';
const KEY = 'encounters-dm-pass';
const msg = document.getElementById('msg');
const pack = await (await fetch('module.json', { cache: 'no-store' })).json();
async function open(pass, typed) {
  try {
    const { html } = await decryptPack(pack, pass);
    try { localStorage.setItem(KEY, pass); } catch {}
    document.open(); document.write(html); document.close();
  } catch { if (typed) msg.textContent = 'That passphrase does not open this page.'; }
}
document.getElementById('f').addEventListener('submit', (e) => { e.preventDefault(); msg.textContent = ''; open(document.getElementById('p').value, true); });
const stored = localStorage.getItem(KEY);
if (stored) await open(stored, false);
</script></main></body></html>
